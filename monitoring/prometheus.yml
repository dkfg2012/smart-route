global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:4000"]
    metrics_path: /metrics

  - job_name: "dashboard"
    static_configs:
      - targets: ["dashboard:8080"]
    metrics_path: /metrics

  - job_name: "vllm"
    static_configs:
      - targets: ["vllm:8000"]
    metrics_path: /metrics

